<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B2B Sales Arrow - DSR Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-background">

        <div class="brand-section">

            <div class="brand-name">
                B2B <span>SALES ARROW</span>
            </div>

            <div class="brand-line"></div>

            <h1>Daily DSR Application</h1>

            <p>
                Employee Productivity &amp; Daily Reporting System
            </p>

        </div>


        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    →
                </div>

                <h2>Employee Login</h2>

                <p>Sign in to continue to your DSR dashboard</p>

            </div>


            <form onsubmit="login(); return false;">

                <label for="employeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="employeeId"
                    placeholder="Enter Employee ID"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    LOGIN
                </button>

            </form>


            <p id="loginMessage"></p>

            <div class="login-footer">
                Internal DSR Management System
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
